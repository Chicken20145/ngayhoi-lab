name: labs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install requirements
        run: >-
          python -m pip install --only-binary=:all: -r bai6-quyche/requirements.txt
      - name: Run bai6 tests
        run: python -X utf8 -m unittest discover -s bai6-quyche/tests -v
      - name: Run bai7 tests
        run: python -X utf8 -m unittest discover -s bai7-agent/tests -v
      - name: Compileall
        run: python -m compileall bai6-quyche bai7-agent
